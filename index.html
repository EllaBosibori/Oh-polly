<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>POLLY | Best-Dressed Guest - Home</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      line-height: 1.4;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* header / top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      padding: 32px 0 20px 0;
      border-bottom: 1px solid rgba(255,215,0,0.2);
    }

    .logo-area {
      cursor: pointer;
    }

    .logo-area h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #FFD700;
    }

    .logo-area p {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      color: #ff69b4;
      margin-top: 4px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      font-weight: 500;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .nav-links a {
      text-decoration: none;
      color: #ffffff;
      font-size: 0.9rem;
      transition: color 0.2s;
      cursor: pointer;
    }
    
    .nav-links a:hover { color: #FFD700; }
    
    .new-arrivals-btn {
      background: linear-gradient(135deg, #FFD700, #ff69b4);
      border: none;
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #0a0a0a;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 4px 15px rgba(255,215,0,0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    
    .new-arrivals-btn i {
      font-size: 0.9rem;
      transition: transform 0.2s;
    }
    
    .new-arrivals-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,215,0,0.4);
    }
    
    .new-arrivals-btn:hover i {
      transform: translateX(5px);
    }

    .header-icons {
      display: flex;
      gap: 1.2rem;
      font-size: 1.1rem;
    }
    .header-icons i { cursor: pointer; transition: color 0.2s; color: #ffffff; }
    .header-icons i:hover { color: #FFD700; }

    .nav-links a.active {
      color: #FFD700;
      border-bottom: 2px solid #FFD700;
      padding-bottom: 4px;
    }

    /* HERO section with three cards */
    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      margin: 60px 0 50px 0;
    }

    .hero-card {
      flex: 1;
      min-width: 280px;
      background: #1a1a1a;
      border-radius: 40px;
      padding: 2rem;
      border: 1px solid rgba(255,215,0,0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .hero-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255,215,0,0.5);
      box-shadow: 0 20px 40px rgba(255,215,0,0.1);
    }

    .hero-card-image {
      width: 100%;
      border-radius: 25px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .hero-card-image img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 25px;
      transition: transform 0.3s ease;
    }

    .hero-card-image img:hover {
      transform: scale(1.02);
    }

    .hero-card-title {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: #FFD700;
      margin-bottom: 8px;
    }

    .hero-card-subtitle {
      font-size: 0.7rem;
      color: #ff69b4;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero-card-desc {
      font-size: 0.85rem;
      color: #cccccc;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* Main Text Section */
    .main-text-section {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      margin: 50px 0 70px 0;
      align-items: center;
    }

    .text-left {
      flex: 1.2;
      min-width: 280px;
    }

    .hero-badge {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
      color: #ff69b4;
      margin-bottom: 1rem;
      display: inline-block;
    }

    .text-left h2 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    .hero-highlight {
      font-style: italic;
      font-weight: 600;
      color: #FFD700;
    }

    .hero-desc {
      font-size: 1rem;
      line-height: 1.5;
      color: #cccccc;
      margin: 1.5rem 0 2rem 0;
      max-width: 500px;
    }

    .shop-btn {
      background: linear-gradient(135deg, #FFD700, #ff69b4);
      border: none;
      padding: 14px 38px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #0a0a0a;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 4px 15px rgba(255,215,0,0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .shop-btn i {
      font-size: 0.9rem;
      transition: transform 0.2s;
    }
    .shop-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255,215,0,0.4);
    }
    .shop-btn:hover i {
      transform: translateX(5px);
    }

    .wear-tagline {
      margin-top: 2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 1px;
      border-left: 3px solid #FFD700;
      padding-left: 1rem;
      color: #ff69b4;
    }

    .text-right {
      flex: 0.8;
      min-width: 260px;
    }

    .info-card {
      background: #1a1a1a;
      border-radius: 40px;
      padding: 2rem;
      border: 1px solid rgba(255,215,0,0.2);
    }

    .info-card h3 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: #FFD700;
    }

    .info-card p {
      color: #cccccc;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* Chic, Bold, Luxe Sections */
    .pillars-showcase {
      margin: 80px 0;
    }

    .pillars-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .pillars-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #FFD700;
    }

    .pillars-title p {
      color: #ff69b4;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin-top: 10px;
    }

    .pillars-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .pillar-card {
      flex: 1;
      min-width: 320px;
      background: #1a1a1a;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      border: 1px solid rgba(255,215,0,0.2);
    }

    .pillar-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 50px rgba(255,215,0,0.15);
      border-color: rgba(255,215,0,0.5);
    }

    .pillar-media {
      width: 100%;
      height: 400px;
      overflow: hidden;
      background: #2a2a2a;
      position: relative;
    }

    .pillar-media video,
    .pillar-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .pillar-card:hover .pillar-media video,
    .pillar-card:hover .pillar-media img {
      transform: scale(1.05);
    }

    .video-overlay {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFD700;
      font-size: 1rem;
      pointer-events: none;
    }

    .pillar-info {
      padding: 28px;
      text-align: center;
      background: #1a1a1a;
    }

    .pillar-icon {
      font-size: 2.5rem;
      color: #FFD700;
      margin-bottom: 12px;
    }

    .pillar-info h3 {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .pillar-info p {
      font-size: 0.85rem;
      color: #ff69b4;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
      margin-bottom: 15px;
    }

    .pillar-desc {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #cccccc;
      margin-top: 12px;
    }

    .pillar-btn {
      margin-top: 20px;
      background: transparent;
      border: 2px solid #FFD700;
      padding: 10px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #FFD700;
    }

    .pillar-btn:hover {
      background: #FFD700;
      color: #0a0a0a;
    }

    /* About Section */
    .about-section {
      margin: 80px 0;
      background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
      border-radius: 60px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,215,0,0.2);
    }

    .about-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3rem;
      padding: 48px;
    }

    .about-media {
      flex: 0.8;
      min-width: 250px;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .about-media video {
      width: 100%;
      height: auto;
      display: block;
      max-height: 300px;
      object-fit: cover;
    }

    .about-content {
      flex: 1.2;
      min-width: 280px;
    }

    .about-badge {
      display: inline-block;
      background: rgba(255,105,180,0.2);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ff69b4;
      margin-bottom: 1rem;
      border: 1px solid rgba(255,105,180,0.3);
    }

    .about-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #FFD700;
    }

    .about-content h3 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #ff69b4;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    .about-content p {
      font-size: 1rem;
      line-height: 1.6;
      color: #cccccc;
      margin-bottom: 1.5rem;
    }

    .about-stats {
      display: flex;
      gap: 2rem;
      margin-top: 1.5rem;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #FFD700;
      font-family: 'Playfair Display', serif;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff69b4;
    }

    /* Brand Showcase */
    .brand-showcase {
      margin: 80px 0;
    }

    .brand-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,215,0,0.2);
      border-bottom: 1px solid rgba(255,215,0,0.2);
      padding: 40px 0;
    }

    .brand-item {
      font-weight: 500;
      font-size: 1.2rem;
      color: #ffffff;
      font-family: 'Playfair Display', serif;
      cursor: pointer;
      transition: color 0.2s;
    }

    .brand-item:hover { color: #FFD700; }

    /* Quote Section */
    .quote-section {
      margin: 80px 0;
      background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
      border-radius: 60px;
      padding: 60px 40px;
      text-align: center;
      border: 1px solid rgba(255,215,0,0.2);
    }

    .quote-section i {
      font-size: 3rem;
      color: #FFD700;
      opacity: 0.6;
      margin-bottom: 20px;
    }

    .quote-section p {
      font-size: 1.8rem;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.4;
      color: #ffffff;
    }

    .quote-stars {
      margin-top: 25px;
    }

    .quote-stars i {
      font-size: 1rem;
      margin: 0 2px;
      color: #FFD700;
    }

    /* INSTAGRAM STORY SECTION - Behind the Scenes Ambassador */
    .bts-story-section {
      margin: 80px 0;
      text-align: center;
    }
    .bts-story-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #FFD700;
      margin-bottom: 30px;
    }
    .bts-story-section p {
      color: #ff69b4;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }
    .instagram-story-container {
      display: flex;
      justify-content: center;
    }
    .instagram-story {
      width: 360px;
      height: 640px;
      background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5), 0 0 0 8px #2a2a2a, 0 0 0 12px #1a1a1a;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .instagram-story:hover {
      transform: scale(1.02);
    }
    .progress-bars {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      z-index: 20;
    }
    .progress-segment {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.4);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: white;
      transition: width 0.1s linear;
    }
    .story-header {
      position: absolute;
      top: 20px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #FFD700, #ff69b4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: #0a0a0a;
    }
    .username {
      font-weight: 700;
      font-size: 14px;
      color: white;
    }
    .timestamp {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      margin-left: 6px;
    }
    .more-icon {
      color: white;
      font-size: 18px;
    }
    .story-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .bts-badge {
      position: absolute;
      top: 80px;
      left: 16px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      color: #FFD700;
      border: 1px solid rgba(255,215,0,0.4);
      z-index: 10;
      letter-spacing: 1px;
    }
    .story-content {
      position: absolute;
      bottom: 100px;
      left: 0;
      right: 0;
      padding: 20px;
      z-index: 10;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }
    .ambassador-name {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: #FFD700;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .caption {
      font-size: 14px;
      color: white;
      line-height: 1.4;
      margin-bottom: 12px;
      opacity: 0.95;
    }
    .hashtags {
      font-size: 11px;
      color: #ff69b4;
      letter-spacing: 0.5px;
    }
    .music-sticker {
      position: absolute;
      bottom: 80px;
      right: 16px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      padding: 6px 12px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: white;
      z-index: 10;
    }
    .reply-bar {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .reply-input {
      color: white;
      font-size: 13px;
      opacity: 0.8;
    }
    .send-icon {
      color: white;
      font-size: 18px;
    }
    .carousel-dots {
      display: flex;
      gap: 8px;
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: all 0.2s;
    }
    .dot.active {
      background: #FFD700;
      width: 18px;
      border-radius: 4px;
    }
    .story-previews {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .preview-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFD700, #ff69b4);
      padding: 2px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .preview-circle:hover {
      transform: scale(1.05);
    }
    .preview-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #FFD700;
    }
    .preview-label {
      font-size: 10px;
      color: #aaa;
      text-align: center;
      margin-top: 5px;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; text-shadow: 0 0 5px #FFD700; }
    }
    .ambassador-name {
      animation: pulseGlow 2s ease-in-out infinite;
    }

    /* Footer */
    .footer-area {
      margin: 50px 0 30px 0;
      padding-top: 40px;
      border-top: 2px solid rgba(255,215,0,0.3);
      background: linear-gradient(180deg, #0a0a0a, #050505);
      border-radius: 40px 40px 0 0;
      padding: 50px 40px 40px 40px;
    }
    .footer-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3rem;
      justify-content: space-between;
    }
    .footer-section {
      flex: 1;
      min-width: 250px;
    }
    .footer-section h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #FFD700;
      border-left: 3px solid #FFD700;
      padding-left: 12px;
    }
    .footer-images {
      flex: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .footer-image-card {
      text-align: center;
      flex: 1;
      min-width: 160px;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 20px;
      transition: transform 0.3s ease;
      border: 1px solid rgba(255,215,0,0.2);
    }
    .footer-large-image {
      width: 100%;
      max-width: 160px;
      height: auto;
      border-radius: 15px;
      margin-bottom: 10px;
      border: 2px solid #FFD700;
    }
    .footer-video {
      width: 100%;
      max-width: 160px;
      height: auto;
      border-radius: 15px;
      margin-bottom: 10px;
      border: 2px solid #FFD700;
    }
    .store-locations {
      margin: 30px 0 20px 0;
      padding: 20px;
      background: rgba(255,215,0,0.05);
      border-radius: 30px;

<body>
<div class="container">
  <!-- Header (same as original) -->
  <div class="top-bar">
    <div class="logo-area" id="homeLink"><h1>POLLY</h1><p>Best-Dressed Guest</p></div>

  <!-- Hero Cards -->

  <!-- NEW: INSTAGRAM STORY SECTION - Behind the Scenes POLLY Ambassador -->
  <div class="bts-story-section">
    <h2><i class="fab fa-instagram"></i> Behind the Scenes</h2>
    <p>✨ POLLY Ambassador Sofia Reyes ✨ | Exclusive BTS from the Golden Hour Shoot</p>
    <div class="instagram-story-container" id="instagramStoryContainer">
      <!-- Story component will be injected via JS but we include placeholder -->
    </div>
    <div class="story-previews" id="storyPreviews"></div>
    <div style="margin-top: 15px; font-size: 12px; color: #888;"><i class="fas fa-hand-pointer"></i> Tap left/right edges to navigate • Tap center to pause</div>
  </div>

  <!-- Footer -->
  <div class="footer-area">...</div>
</div>

<script>
  // Sample BTS Stories Data - POLLY Ambassador
  const stories = [
    { image: "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=800&h=1200&fit=crop", ambassador: "Sofia Reyes", caption: "Golden Hour magic ✨ The POLLY team setting up the perfect shot. This Lemon Yellow moment is everything! 💛", hashtags: "#POLLYAmbassador #GoldenHour #BTS", music: "Golden Hour • JVKE" },
    { image: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800&h=1200&fit=crop", ambassador: "Sofia Reyes", caption: "Hair & makeup magic 🎨 Prepping for the Bold Collection campaign. The energy backstage is electric!", hashtags: "#POLLYBTS #MakeupMoments #BoldCollection", music: "Unstoppable • Sia" },
    { image: "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=800&h=1200&fit=crop", ambassador: "Sofia Reyes", caption: "Quick fit check before stepping onto set 🖤 The new Luxe cape is giving main character energy.", hashtags: "#POLLYLuxe #FitCheck #AmbassadorLife", music: "Runway • Vintage Culture" },
    { image: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=800&h=1200&fit=crop", ambassador: "Sofia Reyes", caption: "Candid laughs with the creative team 🎬 This is what being a POLLY ambassador is all about — passion, creativity, sisterhood.", hashtags: "#POLLYFamily #Sisterhood #BehindTheScenes", music: "Feeling Good • Nina Simone" },
    { image: "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=800&h=1200&fit=crop", ambassador: "Sofia Reyes", caption: "Wrap party vibes! 🥂 Another iconic campaign in the books. Can't wait for you to see what we've created. #POLLYMagic", hashtags: "#POLLYWrapParty #BestDressedGuest #ComingSoon", music: "Celebration • Kool & The Gang" }
  ];

  let currentStoryIndex = 0;
  let progressInterval = null;
  let isPaused = false;
  const STORY_DURATION = 7000;
  let progressFills = [];

  function buildStoryUI() {
    const container = document.getElementById('instagramStoryContainer');
    container.innerHTML = `
      <div class="instagram-story" id="instagramStory">
        <div class="progress-bars" id="progressBars"></div>
        <div class="story-header"><div class="user-info"><div class="avatar">✨</div><div><span class="username">pollyambassadors</span><span class="timestamp">• 2h ago</span></div></div><div class="more-icon"><i class="fas fa-ellipsis-h"></i></div></div>
        <img class="story-bg" id="storyBg" src="">
        <div class="bts-badge"><i class="fas fa-video"></i> BEHIND THE SCENES</div>
        <div class="carousel-dots" id="carouselDots"></div>
        <div class="story-content"><div class="ambassador-name" id="ambassadorName"></div><div class="caption" id="caption"></div><div class="hashtags" id="hashtags"></div></div>
        <div class="music-sticker" id="musicSticker"><i class="fas fa-music"></i> <span id="musicText"></span></div>
        <div class="reply-bar"><div class="reply-input"><i class="far fa-comment-dots"></i> Send message...</div><div class="send-icon"><i class="far fa-heart"></i></div></div>
      </div>`;
      
    // Create progress bars
    const progressContainer = document.getElementById('progressBars');
    progressContainer.innerHTML = '';
    for (let i = 0; i < stories.length; i++) {
      const seg = document.createElement('div');
      seg.className = 'progress-segment';
      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      seg.appendChild(fill);
      progressContainer.appendChild(seg);
      progressFills.push(fill);
    }
    
    // Carousel dots
    const dotsContainer = document.getElementById('carouselDots');
    dotsContainer.innerHTML = '';
    for (let i = 0; i < stories.length; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      dot.addEventListener('click', (e) => { e.stopPropagation(); jumpToStory(i); });
      dotsContainer.appendChild(dot);
    }
    
    // Previews
    const previewsContainer = document.getElementById('storyPreviews');
    previewsContainer.innerHTML = '';
    stories.forEach((_, idx) => {
      const circle = document.createElement('div');
      circle.className = 'preview-circle';
      circle.innerHTML = `<div class="preview-inner"><i class="fas fa-camera"></i></div><div class="preview-label">BTS #${idx+1}</div>`;
      circle.addEventListener('click', () => jumpToStory(idx));
      previewsContainer.appendChild(circle);
    });
  }
  
  function updateContent(index) {
    const story = stories[index];
    document.getElementById('storyBg').src = story.image;
    document.getElementById('ambassadorName').innerText = story.ambassador;
    document.getElementById('caption').innerText = story.caption;
    document.getElementById('hashtags').innerText = story.hashtags;
    document.getElementById('musicText').innerHTML = story.music;
    
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, i) => { if (i === index) dot.classList.add('active'); else dot.classList.remove('active'); });
    for (let i = 0; i < progressFills.length; i++) {
      if (i < index) progressFills[i].style.width = '100%';
      else if (i === index) progressFills[i].style.width = '0%';
      else progressFills[i].style.width = '0%';
    }
  }
  
  function startProgress() {
    if (progressInterval) clearInterval(progressInterval);
    const startTime = Date.now();
    const segIdx = currentStoryIndex;
    progressInterval = setInterval(() => {
      if (isPaused) return;
      const elapsed = Date.now() - startTime;
      const percent = Math.min(100, (elapsed / STORY_DURATION) * 100);
      if (progressFills[segIdx]) progressFills[segIdx].style.width = percent + '%';
      if (percent >= 100) {
        clearInterval(progressInterval);
        nextStory();
      }
    }, 30);
  }
  
  function nextStory() {
    if (currentStoryIndex + 1 < stories.length) {
      currentStoryIndex++;
      updateContent(currentStoryIndex);
      startProgress();
    } else {
      currentStoryIndex = 0;
      updateContent(currentStoryIndex);
      startProgress();
    }
  }
  
  function prevStory() {
    if (currentStoryIndex - 1 >= 0) {
      currentStoryIndex--;
      updateContent(currentStoryIndex);
      startProgress();
    } else {
      currentStoryIndex = stories.length - 1;
      updateContent(currentStoryIndex);
      startProgress();
    }
  }
  
  function jumpToStory(index) {
    if (progressInterval) clearInterval(progressInterval);
    currentStoryIndex = index;
    updateContent(currentStoryIndex);
    startProgress();
    isPaused = false;
  }
  
  function attachStoryEvents() {
    const storyEl = document.getElementById('instagramStory');
    storyEl.addEventListener('click', (e) => {
      const rect = storyEl.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const width = rect.width;
      if (x < width / 3) { if (progressInterval) clearInterval(progressInterval); prevStory(); isPaused = false; }
      else if (x > (width * 2) / 3) { if (progressInterval) clearInterval(progressInterval); nextStory(); isPaused = false; }
      else { isPaused = !isPaused; if (!isPaused) startProgress(); else if (progressInterval) clearInterval(progressInterval); }
    });
  }
  
  buildStoryUI();
  updateContent(0);
  startProgress();
  attachStoryEvents();
  
  // Simple toast for other interactive elements (optional)
  function showToast(msg) { alert(msg); } // light placeholder
  document.querySelectorAll('.hero-card, .pillar-card, .shop-btn').forEach(el => el.addEventListener('click', () => showToast('✨ Explore POLLY collections ✨')));
</script>
</body>
